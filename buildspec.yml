version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - docker build -t batch-demo-mongo .
      - docker tag batch-demo-mongo:latest $AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/batch-demo-mongo:latest
  post_build:
    commands:
      - echo Pushing image to ECR...
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/batch-demo-mongo:latest
      - echo Build completed on `date`